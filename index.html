<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>PUBG UC · شراء</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  /* ===== الصفحة الأولى ===== */
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,system-ui,-apple-system,sans-serif}
  html,body{overscroll-behavior:none;-webkit-overflow-scrolling:touch;overflow:hidden;height:100%}
  body{background:#f5f7fa;display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
  .page{max-width:100%;width:100%;height:100%;overflow:hidden}
  .card{width:100%;background:#fff;color:#1a1a1a;position:relative;overflow:hidden;height:100%}
  .top-image{width:100%;line-height:0}
  .top-image img{width:100%;height:auto;display:block}
  .content{padding:18px 16px 24px}

  .user-section{background:#f0f2f5;border-radius:28px;padding:6px 18px 6px 12px;margin-bottom:18px;margin-top:-8px;display:flex;align-items:center;gap:10px;border:1px solid #e0e4e8;flex-direction:row-reverse;height:56px;position:relative}
  .user-section i{color:#777;font-size:18px;order:3}
  .user-section input{background:transparent;border:none;outline:none;color:#1a1a1a;font-size:16px;padding:10px 0;flex:1;min-width:100px;text-align:left;direction:ltr;order:1}
  .user-section input::placeholder{color:#999;font-weight:400;text-align:right;direction:rtl;font-size:14px}
  .player-error-msg{display:none;color:#dc2626;font-size:11px;font-weight:600;background:#fee2e2;padding:3px 10px;border-radius:20px;white-space:nowrap;order:2}
  .player-error-msg.show{display:inline-block}
  .player-confirm-msg{display:none;color:#1a73e8;font-size:12px;font-weight:600;background:#e8f0fe;padding:4px 12px;border-radius:20px;white-space:nowrap;order:2}
  .player-confirm-msg.show{display:inline-block}
  .player-confirm-msg i{font-size:12px;margin-left:4px;color:#1a73e8}
  .player-ok-msg{display:none;color:#888;font-size:13px;font-weight:700;background:#e8eaed;padding:4px 12px;border-radius:20px;order:2}
  .player-ok-msg.show{display:inline-block}
  .player-ok-msg .spinner-icon{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top:2px solid #888;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

  .country-section{background:#f0f2f5;border-radius:28px;padding:6px 18px;margin-bottom:18px;margin-top:-8px;display:flex;align-items:center;gap:10px;border:1px solid #e0e4e8;flex-direction:row-reverse;cursor:pointer;position:relative;height:56px}
  .country-section:active{background:#e8ecf1}
  .country-label{font-size:14px;font-weight:700;color:#555;white-space:nowrap;order:3;pointer-events:none}
  .country-section select{display:none}
  .country-section .select-arrow{order:2;color:#555;font-size:12px;pointer-events:none}
  .country-display{order:1;flex:1;font-size:14px;font-weight:600;color:#1a1a1a;text-align:right;direction:rtl;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .custom-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-height:300px;overflow-y:auto;z-index:1000;margin-top:6px;border:1px solid #e0e4e8;direction:rtl}
  .custom-dropdown.active{display:block}
  .custom-dropdown-item{padding:12px 16px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:right;border-bottom:1px solid #f0f2f5}
  .custom-dropdown-item:last-child{border-bottom:none}
  .custom-dropdown-item:hover{background:#f0f2f5}
  .custom-dropdown-item.selected{background:#e8f0fe;font-weight:600}

  .coin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;direction:rtl;margin-top:-8px}
  .coin-option{background:#f8f9fc;border-radius:16px;padding:16px 8px;text-align:center;border:2px solid #e8ecf1;transition:.2s;cursor:pointer;position:relative}
  .coin-option:hover{border-color:#d0d5e0;transform:translateY(-1px)}
  .coin-option.selected{border-color:#1a73e8;background:#e8f0fe;box-shadow:0 0 0 1px #1a73e8}
  .coin-option .coins{font-weight:700;font-size:18px;color:#1a1a1a;line-height:1.3;margin-top:4px;direction:ltr;unicode-bidi:embed}
  .coin-option .uc-symbol{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;margin:0 auto 6px}
  .coin-option .uc-symbol .uc-icon-img{width:100%;height:100%;display:block;object-fit:contain}
  .coin-option .total-price{font-size:14px;font-weight:700;color:#1a73e8;background:#e8f0fe;padding:4px 10px;border-radius:20px;display:inline-block;margin-top:6px;border:1px solid #7baaf7}

  .action-btn{width:100%;background:#1a73e8;border:none;padding:16px;border-radius:60px;font-weight:700;font-size:18px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 0 #0d47a1;transition:.08s linear;margin-bottom:14px;cursor:pointer}
  .action-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #0d47a1}
  .action-btn:disabled{opacity:.7;cursor:not-allowed;transform:translateY(4px);box-shadow:0 4px 0 #0d47a1}

  .loading-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);justify-content:center;align-items:center;z-index:1300;padding:24px}
  .loading-overlay.active{display:flex}
  .loading-card{background:#fff;max-width:300px;width:100%;border-radius:32px;padding:40px 24px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.2);direction:rtl}
  .loading-spinner{width:64px;height:64px;margin:0 auto 20px;border:6px solid #e0e4e8;border-top:6px solid #1a73e8;border-radius:50%;animation:spin .8s linear infinite}
  .loading-card p{font-size:16px;font-weight:700;color:#1a1a1a}
  .loading-card .loading-sub{font-size:13px;color:#888;margin-top:6px;font-weight:400}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:2000;display:none;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .toast.show{display:block}

  @media (max-width:400px){
    .content{padding:14px 12px 24px}
    .coin-option .coins{font-size:16px}
    .coin-option .total-price{font-size:12px;padding:3px 8px}
    .coin-option .uc-symbol{width:60px;height:60px}
    .user-section,.country-section{height:50px}
  }
  @media (min-width:421px){ .content{padding-left:24px;padding-right:24px} }

  /* ===== الصفحة الثانية (الدفع) ===== */

    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #f4f6f8;
    z-index: 1500;
    overflow-y: auto;
    direction: rtl;
  }
  .payment-page-overlay.active {
    display: block;

  .payment-page-overlay .main-wrapper {

    width: 100%;
    margin: 0 auto;
    padding: 0 4px;
  }

  .payment-page-overlay .pay-panel {

    border: 1px solid #e8ecf0;

    box-shadow: none;

  .payment-page-overlay .pay-header {

  .payment-page-overlay .pay-body {

    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  @media (max-width: 767px) {
    .payment-page-overlay .pay-body {
      padding: 1rem 1rem 1.125rem;
      gap: 14px;
    }
  }

  .payment-page-overlay .radio-card {
    display: block;
    position: relative;
    cursor: pointer;
    width: 100%;
    margin: 0 !important;
  }
  .payment-page-overlay .radio-card input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .payment-page-overlay .card-content-wrapper {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 1rem;
    padding-top: 16px;
    padding-bottom: 16px;
    padding-inline-start: 14px;
    padding-inline-end: 8px;
    border: 2px solid #f0f3f7;
    border-radius: 8px;
    background: #fff;
    transition: border-color 150ms ease,
                background-color 150ms ease,
                box-shadow 150ms ease;
  }
  .payment-page-overlay .radio-card:hover .card-content-wrapper {
    border-color: #e8ecf0;
  }
  .payment-page-overlay .radio-card input[type="radio"]:checked + .card-content-wrapper {
    border-color: #0194fe;
    background-color: rgba(1, 148, 254, 0.08);
    box-shadow: 0 2px 8px rgba(1, 148, 254, 0.12);
  }

  .payment-page-overlay .check-icon {
    width: 20px;
    height: 20px;
    min-width: 20px;
    max-width: 20px;
    border: 2px solid #e3e3e3;
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
    background: #fff;
    margin-inline-end: 2px;
    transition: width 200ms linear,
                height 200ms linear,
                min-width 200ms linear,
                max-width 200ms linear,
                background-color 200ms linear,
                border-color 200ms linear,
                margin-inline-end 200ms linear,
                transform 200ms linear,
                box-shadow 200ms linear;
  }
  .payment-page-overlay .check-icon::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='9' viewBox='0 0 12 9' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 4.5L4.5 8L11 1' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 12px;
    opacity: 0;
    transition: opacity 200ms linear;
  }
  .payment-page-overlay .radio-card input[type="radio"]:checked + .card-content-wrapper .check-icon {
    width: 24px;
    height: 24px;
    min-width: 24px;
    max-width: 24px;
    background: #0194fe;
    border-color: #0194fe;
    box-shadow: 0 0 0 2px rgba(1, 148, 254, 0.15);
    transform: translateX(-4px);
    margin-inline-end: 6px;
  }
  .payment-page-overlay .radio-card input[type="radio"]:checked + .card-content-wrapper .check-icon::before {
    opacity: 1;
    background-size: 13px;
  }

  .payment-page-overlay .card-content {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    flex: 1;
    min-width: 0;
    justify-content: flex-start;
  }
  .payment-page-overlay .card-content img {
    vertical-align: middle;
    max-width: 100%;
    height: auto;
    padding: 4px;
    display: block;
  }

  .payment-page-overlay .card-content img[alt="visa"] { width: 55px; }
  .payment-page-overlay .card-content img[alt="MasterCard"] { width: 42px; }
  .payment-page-overlay .card-content img[alt="Mada"] { width: 55px; }
  .payment-page-overlay .card-content img[alt="Apple Pay & Google Pay"] {
    max-height: 28px;
    max-width: calc(100% - 175px);
  }
  .payment-page-overlay .card-content img[alt="wallets"] { width: 300px; }
  .payment-page-overlay .card-content img[alt="instapay"] {
    max-height: 25px;
    padding: 4px 0;
  }
  .payment-page-overlay .card-content img[alt="Fawry"] { width: 100px; }

  .payment-page-overlay .main-payment-badge {
    position: absolute;
    top: 8px;
    left: 10px;
    background: #0194fe;
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    line-height: 1.5;
    pointer-events: none;
  }

  .payment-page-overlay #pay-btn-container.fixed-bottom {
    position: fixed !important;
    bottom: 8px;
    left: 0;
    right: 0;
    margin-bottom: 0 !important;
    box-shadow: none;
    border-top: 1px solid #e8ecf0;
    background: #fff;
    padding: 0 5px !important;
    width: 100%;
    z-index: 1000;
  }

  .payment-page-overlay #pay-btn-container .container {
    background: #fff !important;
    border-radius: 8px !important;
    max-width: 100%;
    width: 100%;
    margin: 0 auto;
    padding: 8px 12px;
  }

  .payment-page-overlay #pay-btn-container .col-12.col-lg-6 {
    width: 100%;
    max-width: 100%;
    padding: 0;
  }

  .payment-page-overlay .pay-btn {
    width: 100% !important;
    height: 51px;
    background: #0194fe !important;
    border: 2px solid #0194fe !important;
    border-radius: 8px !important;
    color: #fff !important;
    font-family: DinNext, "Segoe UI", Tahoma, Arial, sans-serif !important;
    font-size: 17px !important;
    font-weight: 700 !important;
    line-height: 1.7 !important;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 1.25rem;
    box-shadow: none !important;
    transition: filter 150ms ease;
  }

  .payment-page-overlay .pay-btn span {
    font-family: inherit !important;
    font-size: inherit !important;
    font-weight: inherit !important;
    line-height: inherit !important;
    color: inherit !important;
  }

  .payment-page-overlay .pay-btn:hover {
    background: #0194fe !important;
    border-color: #0194fe !important;
    box-shadow: none !important;
  }

  .payment-page-overlay .pay-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .payment-page-overlay .pay-btn .fas.fa-arrow-left {
    font-family: "Font Awesome 5 Free", "Font Awesome 5 Pro", sans-serif !important;
    font-weight: 900 !important;
    font-size: 18px !important;
    line-height: 1;
    display: inline-flex;
    align-items: center;
  }

  .payment-page-overlay .pay-btn .fas.fa-arrow-left::before {
    content: "\f060";
  }

  @media (max-width: 767px) {
    .payment-page-overlay .main-wrapper { padding: 0 4px; }
    .payment-page-overlay .pay-panel { max-width: 100%; margin: 0 auto; padding: 0; }
    .payment-page-overlay .card-content-wrapper { padding-top: 14px; padding-bottom: 14px; }
    .payment-page-overlay .card-content img[alt="Apple Pay & Google Pay"] { max-width: 100%; }
    .payment-page-overlay .card-content img[alt="wallets"] { width: 250px; }

  }
  @media (min-width: 768px) {
    .payment-page-overlay .pay-header { display: none; }
  }
</style>

    { code:'SAR', name:'🇸🇦 ريال سعودي',        symbol:'ر.س',  rate:3.75 },

    { code:'KWD', name:'🇰🇼 دينار كويتي',       symbol:'د.ك',  rate:0.30 },
    { code:'QAR', name:'🇶🇦 ريال قطري',         symbol:'ر.ق',  rate:3.64 },
    { code:'BHD', name:'🇧🇭 دينار بحريني',      symbol:'د.ب',  rate:0.376 },
    { code:'OMR', name:'🇴🇲 ريال عماني',        symbol:'ر.ع',  rate:0.385 },
    { code:'MAD', name:'🇲🇦 درهم مغربي',        symbol:'د.م.', rate:10.10 },
    { code:'DZD', name:'🇩🇿 دينار جزائري',      symbol:'د.ج',  rate:134.5 },
    { code:'TND', name:'🇹🇳 دينار تونسي',       symbol:'د.ت',  rate:3.12 },
    { code:'LYD', name:'🇱🇾 دينار ليبي',        symbol:'د.ل',  rate:4.85 },
    { code:'EUR', name:'🇪🇺 يورو',              symbol:'€',    rate:0.92 },
    { code:'GBP', name:'🇬🇧 جنيه إسترليني',     symbol:'£',    rate:0.79 },
    { code:'RUB', name:'🇷🇺 روبل روسي',         symbol:'₽',    rate:92 },
    { code:'UAH', name:'🇺🇦 هريفنيا أوكرانية',   symbol:'₴',    rate:41 },
    { code:'TRY', name:'🇹🇷 ليرة تركية',        symbol:'₺',    rate:32.0 },
    { code:'JOD', name:'🇯🇴 دينار أردني',       symbol:'د.أ',  rate:0.709 },
    { code:'LBP', name:'🇱🇧 ليرة لبنانية',       symbol:'ل.ل',  rate:89500 },
    { code:'IQD', name:'🇮🇶 دينار عراقي',       symbol:'ع.د',  rate:1310 },
    { code:'SYP', name:'🇸🇾 ليرة سورية',        symbol:'ل.س',  rate:13000 },
    { code:'YER', name:'🇾🇪 ريال يمني',         symbol:'ر.ي',  rate:530 },
    { code:'INR', name:'🇮🇳 روبية هندية',       symbol:'₹',    rate:83.5 },
    { code:'PKR', name:'🇵🇰 روبية باكستانية',   symbol:'₨',    rate:278 },
    { code:'BDT', name:'🇧🇩 تاكا بنغلاديشية',    symbol:'৳',    rate:117 },
    { code:'IDR', name:'🇮🇩 روبية إندونيسية',   symbol:'Rp',   rate:15800 },
    { code:'MYR', name:'🇲🇾 رينغيت ماليزي',     symbol:'RM',   rate:4.7 },
    { code:'PHP', name:'🇵🇭 بيسو فلبيني',       symbol:'₱',    rate:57 },
    { code:'THB', name:'🇹🇭 بات تايلاندي',      symbol:'฿',    rate:36.5 },
    { code:'VND', name:'🇻🇳 دونغ فيتنامي',      symbol:'₫',    rate:25400 },
    { code:'CNY', name:'🇨🇳 يوان صيني',         symbol:'¥',    rate:7.25 },
    { code:'JPY', name:'🇯🇵 ين ياباني',          symbol:'¥',    rate:157 },
    { code:'KRW', name:'🇰🇷 وون كوري',          symbol:'₩',    rate:1380 },
    { code:'SDG', name:'🇸🇩 جنيه سوداني',       symbol:'ج.س',  rate:601 },
    { code:'ZAR', name:'🇿🇦 راند جنوب أفريقي',   symbol:'R',    rate:18.5 },
    { code:'NGN', name:'🇳🇬 نيرة نيجيرية',       symbol:'₦',    rate:1500 },
    { code:'KES', name:'🇰🇪 شلن كيني',          symbol:'KSh',  rate:130 },
    { code:'GHS', name:'🇬🇭 سيدي غاني',         symbol:'₵',    rate:15 },
    { code:'ETB', name:'🇪🇹 بير إثيوبي',        symbol:'Br',   rate:57 },
    { code:'XOF', name:'🌍 فرنك غرب أفريقيا',   symbol:'CFA',  rate:600 },
    { code:'XAF', name:'🌍 فرنك وسط أفريقيا',   symbol:'FCFA', rate:600 },
    { code:'AUD', name:'🇦🇺 دولار أسترالي',      symbol:'A$',   rate:1.52 }
  ];

  const currencyData = {};
  currencyList.forEach(c => {
    currencyData[c.code] = { symbol: c.symbol, rate: c.rate };
  });

  const $ = id => document.getElementById(id);
  const usernameInput = $('username'), playerOkMsg = $('playerOkMsg'),
        playerConfirmMsg = $('playerConfirmMsg'), playerErrorMsg = $('playerErrorMsg'),
        countrySelect = $('countrySelect'), countryDisplay = $('countryDisplay'),
        countrySection = $('countrySection'), customDropdown = $('customDropdown'),
        coinGrid = $('coinGrid'), proceedBtn = $('proceedBtn'),
        loadingOverlay = $('loadingOverlay'), toast = $('toast'),
        paymentPageOverlay = $('paymentPageOverlay'),
        finalPayBtn = $('finalPayBtn');

  let selectedCoins = null, selectedEGP = null;
  let coinOptions = [], confirmTimer = null, okTimer = null, lastUsername = '';
  let isSubmitting = false;

  function isValidUsername(u) { return /^[1-9][0-9]{7,14}$/.test(u); }
  function showLoading() { loadingOverlay.classList.add('active'); }
  function hideLoading() { loadingOverlay.classList.remove('active'); }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4000);
  }

  function formatPrice(value) {
    const v = +value.toFixed(2);
    return Number.isInteger(v) ? v.toFixed(0) : v.toFixed(2);
  }

  function buildCurrencySelect() {
    countrySelect.innerHTML = '';
    currencyList.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.code;
      opt.dataset.symbol = c.symbol;
      opt.dataset.rate = c.rate;
      opt.textContent = c.name;
      countrySelect.appendChild(opt);
    });
    countryDisplay.textContent = countrySelect.options[0].text;
  }

  function buildCustomDropdown() {
    customDropdown.innerHTML = '';
    Array.from(countrySelect.options).forEach(opt => {
      const div = document.createElement('div');
      div.className = 'custom-dropdown-item';
      div.textContent = opt.text;
      div.dataset.value = opt.value;
      div.addEventListener('click', e => {
        e.stopPropagation();
        countrySelect.value = opt.value;
        countrySelect.dispatchEvent(new Event('change'));
        customDropdown.classList.remove('active');
        document.querySelectorAll('.custom-dropdown-item').forEach(it => {
          it.classList.toggle('selected', it.dataset.value === opt.value);
        });
      });
      customDropdown.appendChild(div);
    });
    const cur = countrySelect.value;
    document.querySelectorAll('.custom-dropdown-item').forEach(it => {
      it.classList.toggle('selected', it.dataset.value === cur);
    });
  }

  countrySection.addEventListener('click', e => {
    if (e.target.closest('.custom-dropdown')) return;
    e.stopPropagation();
    if (customDropdown.classList.contains('active')) {
      customDropdown.classList.remove('active');
    } else {
      customDropdown.classList.add('active');
      setTimeout(() => {
        const sel = customDropdown.querySelector('.custom-dropdown-item.selected');
        if (sel) customDropdown.scrollTop = Math.max(0, sel.offsetTop - customDropdown.clientHeight/2 + sel.clientHeight/2);
      }, 0);
    }
  });
  document.addEventListener('click', e => {
    if (!countrySection.contains(e.target)) customDropdown.classList.remove('active');
  });

  function createCoinOption(coins, egp) {
    const div = document.createElement('div');
    div.className = 'coin-option';
    div.dataset.coins = coins;
    div.dataset.egp = egp;
    div.innerHTML = `
      <div class="uc-symbol"><img class="uc-icon-img" src="${UC_ICON}" alt="UC"></div>
      <div class="coins">${coins.toLocaleString('en-US')}</div>
      <div class="total-price">ج.م 0</div>
    `;
    return div;
  }

  function buildCoinGrid() {
    coinGrid.innerHTML = '';
    coinPackages.forEach(p => coinGrid.appendChild(createCoinOption(p.coins, p.egp)));

    document.querySelectorAll('.coin-option').forEach(o => o.addEventListener('click', onCoinClick));
    coinOptions = document.querySelectorAll('.coin-option');
    updateAllPrices();

    const def = document.querySelector('.coin-option[data-coins="500"]');
    if (def) def.click();
  }

  function updateAllPrices() {
    const rate = currencyData[countrySelect.value].rate / EGP_RATE;
    const sym = currencyData[countrySelect.value].symbol;

    document.querySelectorAll('.coin-option').forEach(opt => {
      const egp = parseFloat(opt.dataset.egp);
      if (!isNaN(egp)) {
        const el = opt.querySelector('.total-price');
        if (el) el.textContent = `${sym} ${formatPrice(egp * rate)}`;
      }
    });

    const sel = document.querySelector('.coin-option.selected');
    if (sel) {
      selectedEGP = parseFloat(sel.dataset.egp);
    }
  }

  function onCoinClick() {
    const opt = this;
    document.querySelectorAll('.coin-option').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');

    selectedCoins = parseInt(opt.dataset.coins, 10);
    selectedEGP = parseFloat(opt.dataset.egp);
  }

  countrySelect.addEventListener('change', function () {
    countryDisplay.textContent = this.options[this.selectedIndex].text;
    updateAllPrices();
    document.querySelectorAll('.custom-dropdown-item').forEach(it => {
      it.classList.toggle('selected', it.dataset.value === this.value);
    });
  });

  usernameInput.addEventListener('input', function () {
    this.value = this.value.replace(/[^0-9]/g, '');
    playerOkMsg.classList.remove('show');
    playerConfirmMsg.classList.remove('show');
    playerErrorMsg.classList.remove('show');
    clearTimeout(confirmTimer); clearTimeout(okTimer);
    if (this.value.trim() !== lastUsername) lastUsername = '';
  });

  usernameInput.addEventListener('paste', function () {
    setTimeout(() => { this.blur(); }, 50);
  });

  usernameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      this.blur();
    }
  });

  usernameInput.addEventListener('blur', function () {
    const val = this.value.trim();
    if (isValidUsername(val)) {
      playerErrorMsg.classList.remove('show');
      if (val === lastUsername) { playerOkMsg.classList.remove('show'); playerConfirmMsg.classList.add('show'); return; }
      playerOkMsg.classList.add('show'); playerConfirmMsg.classList.remove('show');
      lastUsername = val;
      okTimer = setTimeout(() => { playerOkMsg.classList.remove('show'); playerConfirmMsg.classList.add('show'); }, 1000);
    } else if (val !== '') {
      playerOkMsg.classList.remove('show'); playerConfirmMsg.classList.remove('show'); playerErrorMsg.classList.add('show');
      lastUsername = '';
    } else {
      playerOkMsg.classList.remove('show'); playerConfirmMsg.classList.remove('show'); playerErrorMsg.classList.remove('show');
    }
  });

  /* ====== زر متابعة الدفع (فتح صفحة الدفع) ====== */
  proceedBtn.addEventListener('click', () => {
    const username = usernameInput.value.trim();
    if (!isValidUsername(username)) {
      usernameInput.focus();
      playerErrorMsg.classList.add('show');
      playerConfirmMsg.classList.remove('show');
      playerOkMsg.classList.remove('show');
      return;
    }

    if (!selectedCoins || selectedCoins <= 0) {
      coinOptions.forEach(opt => { opt.style.borderColor = '#1a73e8'; setTimeout(() => opt.style.borderColor = '', 500); });
      return;
    }

    history.pushState({ page: 'payment' }, '', '');

    paymentPageOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  });

  /* ✅ التعامل مع زر الرجوع */
  window.addEventListener('popstate', function (e) {
    if (paymentPageOverlay.classList.contains('active')) {
      paymentPageOverlay.classList.remove('active');
      document.body.style.overflow = '';

      // ✅ إخفاء علامة التحميل وإرجاع الزر لحالته الطبيعية
      hideLoading();
      isSubmitting = false;
      if (finalPayBtn) finalPayBtn.disabled = false;
    }
  });

  /* ✅ إخفاء أي loading عند تحميل الصفحة لأول مرة */
  window.addEventListener('load', function () {
    hideLoading();
    isSubmitting = false;
    if (finalPayBtn) finalPayBtn.disabled = false;
  });

  /* ====== زر الدفع النهائي ====== */
  finalPayBtn.addEventListener('click', async () => {
    if (isSubmitting) return;

    const selectedMethod = document.querySelector('input[name="payment"]:checked');

    if (!selectedMethod || (selectedMethod.value !== 'card' && selectedMethod.value !== 'wallet')) {
      return;
    }

    const method = selectedMethod.value;

    isSubmitting = true;
    finalPayBtn.disabled = true;
    showLoading();

    try {
      const orderId = `ORD-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          amount: selectedEGP.toFixed(2),
          coins: selectedCoins,
          playerId: usernameInput.value.trim(),
          order: orderId,
          email: 'customer@example.com',
          method: method,
        }),
      });

      const data = await response.json();

      const sessionUrl = data.sessionUrl
        || (data._id ? `https://payments.kashier.io/session/${data._id}?mode=test` : null);

      if (sessionUrl) {
        history.pushState({ page: 'kashier' }, '', '');

        sessionStorage.setItem('paymentState', JSON.stringify({
          page: 'payment',
          playerId: usernameInput.value.trim(),
          coins: selectedCoins,
          egp: selectedEGP,
          currency: countrySelect.value,
          timestamp: Date.now()
        }));

        window.location.href = sessionUrl;
      } else {
        console.error('Kashier response:', data);
        showToast('حدث خطأ أثناء إنشاء الدفع، حاول مرة أخرى');
        hideLoading();
        isSubmitting = false;
        finalPayBtn.disabled = false;
      }
    } catch (error) {
      console.error('Error:', error);
      showToast('تعذر الاتصال بالخادم، تحقق من الإنترنت');
      hideLoading();
      isSubmitting = false;
      finalPayBtn.disabled = false;
    }
  });

  buildCurrencySelect();
  buildCoinGrid();
  buildCustomDropdown();
  countrySelect.dispatchEvent(new Event('change'));

})();
</script>
